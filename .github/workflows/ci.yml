name: CI/CD - WFX Detector

on:
  push:
    branches: [main, development/wfx-v17-no-license, feature/koppa-build-integrity]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install linting tools and application dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy
      
      - name: Run ruff
        run: ruff check app/ tests/
      
      - name: Run mypy
        run: mypy app/

  koppa-integrity:
    name: Koppa source integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Koppa library
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/chadcoulter/Koppa_Libraries.git@c5ba97cd7271896e6753ce72d876472aa8defa7d#subdirectory=koppa-0.1.1"

      - name: Seal and verify tracked inputs
        run: |
          python scripts/koppa_build_integrity.py seal
          python scripts/koppa_build_integrity.py verify

      - name: Negative tests — corrupted artifact and changed source
        run: python scripts/koppa_build_integrity.py selftest

      - name: Upload sealed build manifest
        uses: actions/upload-artifact@v4
        with:
          name: koppa-build-integrity
          path: build/koppa/
          if-no-files-found: error
          retention-days: 30

  build-check:
    name: Build container (feature branch)
    needs: [koppa-integrity]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/koppa-build-integrity'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Koppa library
        run: |
          python -m pip install "git+https://github.com/chadcoulter/Koppa_Libraries.git@c5ba97cd7271896e6753ce72d876472aa8defa7d#subdirectory=koppa-0.1.1"

      - name: Download sealed source manifest
        uses: actions/download-artifact@v4
        with:
          name: koppa-build-integrity
          path: build/koppa/

      - name: Verify source integrity before container build
        run: python scripts/koppa_build_integrity.py verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: wfx-detector:koppa-build-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: [test, lint, koppa-integrity]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Koppa library
        run: |
          python -m pip install "git+https://github.com/chadcoulter/Koppa_Libraries.git@c5ba97cd7271896e6753ce72d876472aa8defa7d#subdirectory=koppa-0.1.1"

      - name: Download sealed source manifest
        uses: actions/download-artifact@v4
        with:
          name: koppa-build-integrity
          path: build/koppa/

      - name: Verify source integrity before container build
        run: python scripts/koppa_build_integrity.py verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment is handled by .github/workflows/deploy.yml (environment-gated,
  # secret-backed SSH deploy). This CI workflow deliberately has no placeholder jobs.