name: Apply safe Ruff fixes to feature branch

on:
  push:
    branches: [feature/koppa-build-integrity]
    paths:
      - .github/workflows/ruff-autofix.yml

permissions:
  contents: write

jobs:
  auto-fix:
    if: github.ref == 'refs/heads/feature/koppa-build-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/koppa-build-integrity
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only safe Ruff autofixes
        run: |
          python -m pip install ruff==0.5.7
          ruff check --fix app/ tests/ || true
          git diff --check
      - name: Commit fixes only on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ tests/
          if ! git diff --cached --quiet; then
            git commit -m "style: apply safe Ruff fixes to application and tests"
            git push origin HEAD:feature/koppa-build-integrity
          fi
