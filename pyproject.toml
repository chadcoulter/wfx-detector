[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wfx-detector"
version = "1.0.0"
description = "Real-time GitHub webhook detector for WFX Phantom / wfx-loot campaign"
readme = "README.md"
license = {text = "WFX Software License and Patent Non-Appropriation Addendum"}
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "werkzeug==3.0.3",
    "pydantic==2.8.2",
    "python-json-logger==2.0.7",
    "redis==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.5.7",
    "mypy==1.11.1",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20"]
ignore = ["E501", "B008"]
exclude = [".git", "__pycache__", ".venv", "venv", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]