version: '3.8'

services:
  detector:
    build: .
    container_name: wfx-detector
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET required}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - API_ALERT_TOKEN=${API_ALERT_TOKEN:?API_ALERT_TOKEN required}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-10485760}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - redis

  # Redis bound to internal network only; no published port in production.
  redis:
    image: redis:7-alpine
    container_name: wfx-detector-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}

volumes:
  redis-data:
